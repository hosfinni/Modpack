# The modpack's manifest: the Horizon build every part is made for, and the parts.
# tools/horizon.py and tools/package.py read it.

[modpack]
name = "Horizon Hardship"
version = "0.1.2"
game = "26.3"

[horizon]
# The Nightly of 2026-11-13 (tag nightly-source/2026-11-13-9f42064), whose
# NATIVE_HOOKS_API is 415. Every hook and Host helper the mods use is there and
# dispatched to trait mods; `python3 tools/horizon.py check` compiles all five against
# it. Move the pack to another commit with tools/repin.py, which rewrites this file,
# every horizon-mixin.toml and every api/Cargo.toml.
revision = "9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0"
hooks_api = 415
# horizon-mixins, which applies the bundles' [[crate]]s: the launcher's own
# (native_mods::MIXINS_REV) at that Nightly.
mixins_revision = "5a64af938ec86b00d53d16a408aabc0038fb3e57"

# Native mods are not part of the server's mod-list handshake yet, so players and the
# server must install the same versions of these by hand (or from this pack).
[native]
hz_travel = "0.1.2"
hz_survival = "0.1.2"
hz_worldgen = "0.1.2"
hz_seasons = "0.1.2"
hz_arsenal = "0.1.2"
hz_vfx = "0.1.2"

# Hardship Soft Light: a Horizon shader pack (docs/api/shaders.md, API 0.1: on the
# 2026-11-13 Nightly the game draws 0.2 packs only with HORIZON_HDR_FRAME=float).
#
# Vanilla's look, lit a little better and cheaply: warm block light against cool
# skylight, coloured light from soul fire and lava, a glow round a low sun, light
# shafts, a mild grade and soft, light shadows. One small shadow map and one
# full-screen pass, so it costs a fraction of what a full shader pack does.
schema = 1
id = "hz_softlight"
name = "Hardship Soft Light"
version = "0.1.2"
api = "0.1"
description = "Vanilla's look with better light: warm lamps, cool sky, a low sun's glow and light shafts, at a fraction of a full shader pack's cost."
authors = ["Horizon Hardship"]
license = "MIT"
shared = ["common.wgsl"]

[sky]
file = "sky.wgsl"

[material]
file = "material.wgsl"
name = "Terrain light"

# A small shadow map from the sun (the moon by night), for the subtle shadows of the
# material stage. Off with the "Shadows" option, which drops the pass.
[shadow]
resolution = 1024
distance = 96.0
option = "shadows"

[[post]]
file = "post.wgsl"
name = "Shafts and grade"

[budget]
gpu_ms = 1.5

# The colour each light source gives its light (written as vanilla's colours are,
# in gamma). The first entry naming a block wins.
[[lights]]
color = [0.35, 0.75, 1.0]
blocks = ["soul_*"]

[[lights]]
color = [1.0, 0.25, 0.15]
blocks = ["redstone_torch", "redstone_wall_torch", "redstone_ore", "deepslate_redstone_ore"]

[[lights]]
color = [1.0, 0.5, 0.18]
blocks = ["lava", "magma_block", "fire", "campfire"]

[[lights]]
color = [0.55, 0.9, 1.0]
blocks = ["sea_lantern", "conduit", "beacon"]

[[lights]]
color = [0.72, 0.5, 1.0]
blocks = ["nether_portal", "crying_obsidian", "respawn_anchor", "*amethyst_bud", "amethyst_cluster"]

[[lights]]
color = [0.6, 1.0, 0.7]
blocks = ["glow_lichen", "verdant_froglight"]

[[lights]]
color = [1.0, 0.78, 0.48]
blocks = ["torch", "wall_torch", "lantern", "jack_o_lantern", "glowstone", "shroomlight", "ochre_froglight"]

[[options]]
id = "soft_light"
name = "Soft light"
description = "Warm block light, cool skylight, and a brighter sunward side."
type = "bool"
default = true

[[options]]
id = "light_warmth"
name = "Lamp warmth"
description = "How warm lamps and how cool the sky tint what they light."
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "shadows"
name = "Shadows"
description = "Soft, light shadows from the sun and the moon. Costs a shadow pass."
type = "bool"
default = true

[[options]]
id = "shadow_strength"
name = "Shadow strength"
type = "float"
default = 0.35
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "wet_ground"
name = "Wet ground"
description = "Open ground darkens in the rain."
type = "bool"
default = true

[[options]]
id = "sky_glow"
name = "Sun glow"
description = "A warm glow round the sun when it is low, and the season's tint on the sky."
type = "bool"
default = true

[[options]]
id = "shafts"
name = "Light shafts"
description = "Shafts of light from the sun and the moon past whatever stands in front of them."
type = "bool"
default = true

[[options]]
id = "shaft_strength"
name = "Shaft strength"
type = "float"
default = 0.35
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "vignette"
name = "Vignette"
description = "The picture's corners a little darker."
type = "bool"
default = true

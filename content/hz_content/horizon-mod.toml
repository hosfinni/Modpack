id = "hz_content"
name = "Horizon Hardship Content"
version = "0.1.0"
description = "The items, blocks and effects of the Horizon Hardship pack: drinks for thirst, weapons for hz_arsenal's movesets, crushed and washed ores, and the climate anchor. Data and assets only; the behaviour is in the pack's native mods."
authors = ["Horizon Hardship"]
# A content mod: blocks, items and mob effects from data/ and assets/, no code (API 0.2).
api = "0.2"
# Server and clients must both have it: it adds items and blocks to the registries.
side = "both"
# registries: "May add blocks, items, mob effects and entity types to your worlds".
capabilities = ["registries"]

# hz_seasons: Biome Shift. When the players sleep the climate turns, and biomes move:
# snow advances and retreats, deserts spread and green over, and the ground follows.
# A native trait mod (Horizon docs/native-mods.md, "Trait mods"). Build it with
# `horizon-launcher native-build <this folder> --instance <instance> --trust-native-code`.
[mod]
id = "hz_seasons"
version = "0.1.1"

[compatibility]
horizon_revision = "9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0"

[api]
path = "api"

# The rules and their tests, with no game types: `cargo test -p hz-seasons-core`.
[[crate]]
id = "core"
path = "core"

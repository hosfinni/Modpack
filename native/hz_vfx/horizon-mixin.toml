# hz_vfx: small visual effects all through the game. Dust when a block is placed,
# sparks and trails when a blow lands, dust where a player lands or sprints, a
# splash, breath in the cold, fireflies, embers and cave dust, and a camera shake
# for falls and explosions. A native trait mod (Horizon docs/native-mods.md, "Trait
# mods"). Build it with
# `horizon-launcher native-build <this folder> --instance <instance> --trust-native-code`.
[mod]
id = "hz_vfx"
version = "0.1.2"

[compatibility]
horizon_revision = "9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0"

[api]
path = "api"

# The effects' rules and their tests, with no game types: `cargo test -p hz-vfx-core`.
[[crate]]
id = "core"
path = "core"

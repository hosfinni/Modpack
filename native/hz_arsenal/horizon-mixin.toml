# hz_arsenal: eight weapons that fight differently. Each has its own combo, its own
# openers (sprinting, falling, sneaking, from behind) and a weapon art on use.
# The items themselves are in the content pack (hz_content). A native trait mod
# (Horizon docs/native-mods.md, "Trait mods"). Build it with
# `horizon-launcher native-build <this folder> --instance <instance> --trust-native-code`.
[mod]
id = "hz_arsenal"
version = "0.1.0"

[compatibility]
horizon_revision = "4b08a43f1d32c3946f2638850f9d120bc7ff4a26"

[api]
path = "api"

# The movesets and their tests, with no game types: `cargo test -p hz-arsenal-core`.
[[crate]]
id = "core"
path = "core"

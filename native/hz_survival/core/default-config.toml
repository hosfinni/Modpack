"minecraft:cave_spider" = 6
"minecraft:creeper" = 7
"minecraft:witch" = 10
"minecraft:enderman" = 12
"minecraft:pillager" = 7
"minecraft:vindicator" = 10
"minecraft:piglin_brute" = 14
"minecraft:wither_skeleton" = 12
"minecraft:blaze" = 10
"minecraft:ravager" = 30

# Strength in numbers: players near one another hit harder and are hurt less.
[party]
enabled = true
range = 16.0
damage_per_member = 0.1
protection_per_member = 0.08
members = 3

# Monsters: tougher, and they fight as a pack.
[mobs]
enabled = true
# A player's blows on these are divided by `toughness` (1.4 is as good as 40% more
# health), and what they deal to players is multiplied by `damage`.
toughness = 1.4
damage = 1.25
# A monster with nothing to attack joins one of its kind this near (in blocks)
# that is attacking a player.
pack_range = 20.0
# Melee monsters in company come at their target from the sides.
flank = true
# A monster alone and under this share of its health backs away from its target.
retreat_below = 0.3
monsters = [
    "minecraft:zombie", "minecraft:husk", "minecraft:drowned", "minecraft:zombie_villager",
    "minecraft:skeleton", "minecraft:stray", "minecraft:bogged", "minecraft:wither_skeleton",
    "minecraft:spider", "minecraft:cave_spider", "minecraft:creeper", "minecraft:witch",
    "minecraft:pillager", "minecraft:vindicator", "minecraft:piglin_brute", "minecraft:hoglin",
    "minecraft:zoglin", "minecraft:blaze", "minecraft:enderman", "minecraft:phantom",
]
# These never back away.
fearless = ["minecraft:creeper", "minecraft:wither_skeleton", "minecraft:zoglin", "minecraft:phantom"]

# Refining: ore smelted as it comes out of the ground gives only a few nuggets. For
# a whole ingot it is crushed (in a stonecutter), washed (used on a cauldron of
# water) and then smelted.
[refining]
enabled = true
# Nuggets from smelting raw ore or an ore block; an ingot is nine. 0 keeps vanilla's
# recipes.
crude_nuggets = 3
# The chance that washing an ore uses up a level of the cauldron's water.
water_use = 0.25

# hz_survival: thirst, shared progression and smarter monsters. A native trait mod
# (Horizon docs/native-mods.md, "Trait mods"). Build it with
# `horizon-launcher native-build <this folder> --instance <instance> --trust-native-code`.
[mod]
id = "hz_survival"
version = "0.1.2"

[compatibility]
horizon_revision = "9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0"

[api]
path = "api"

# The rules and their tests, with no game types: `cargo test -p hz-survival-core`.
[[crate]]
id = "core"
path = "core"

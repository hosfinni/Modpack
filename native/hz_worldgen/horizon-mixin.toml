# hz_worldgen: tectonic terrain. Continents ride on plates, mountain ranges rise where
# plates meet, and climate follows latitude, height and the sea. A native trait mod
# (Horizon docs/native-mods.md, "Trait mods"). Build it with
# `horizon-launcher native-build <this folder> --instance <instance> --trust-native-code`.
[mod]
id = "hz_worldgen"
version = "0.1.0"

[compatibility]
horizon_revision = "4b08a43f1d32c3946f2638850f9d120bc7ff4a26"

[api]
path = "api"

# The terrain function and its tests, with no game types: `cargo test -p hz-worldgen-core`.
[[crate]]
id = "core"
path = "core"

# hz_worldgen: the shape of new land. Written to config/hz_worldgen.toml the first
# time the game runs with the mod; edit it there. Only the server's file matters,
# except for the far terrain a client draws ahead of its server, which wants the
# same file. Changing it only affects chunks generated afterwards.

# "tectonic": this mod builds the overworld's terrain and biomes.
# "vanilla": the game's own generator (or a worldgen data pack such as Lithosphere,
# see docs/worldgen.md) builds it, and this mod does nothing.
terrain = "tectonic"

sea_level = 63

# The width of a tectonic plate, in blocks. Continents and oceans are a few plates
# across, so this is the scale of the whole map.
plate_size = 2400.0
# The share of plates that are ocean floor.
ocean_fraction = 0.45
# How high ranges rise where plates collide: 1.0 reaches about y 250.
mountain_scale = 1.0
# The distance from the middle of a warm belt to the middle of the next cold belt,
# in blocks. z = 0 lies half way between the two, so a world starts in temperate
# land: north of it (negative z) is warmer, south of it colder, and the pattern
# repeats.
climate_band = 9000.0
rivers = true

# What vanilla still adds to the terrain. Structures are placed where the vanilla
# generator would have put them, at the height its terrain would have had: buried
# ones (strongholds, mineshafts, ancient cities, trial chambers) fit, but villages
# and temples can sit above or below the ground. Turn it off for a world without
# any structure, strongholds included.
structures = true
carvers = true
decorations = true

# Keep vanilla's caves and structures out of this terrain's water. Vanilla decides
# both from its own terrain, so where it had land and this terrain has sea, its
# carvers would cut dry holes through the water and its villages would stand in the
# sea; where it had sea and this terrain has land, monuments and shipwrecks would
# sit on dry ground. With this on, a chunk with water in it or beside it has no
# carved caves, and a chunk keeps its structures only where both terrains agree on
# whether there is water. A structure that crosses such a coast is cut off there,
# and so can a stronghold under the sea: if the eye of ender leads to one whose
# portal room was cut away, travel on until it points to another. false keeps
# vanilla's caves and structures everywhere, as before.
fit_to_sea = true
